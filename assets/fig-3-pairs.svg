  <line x1="80" y1="238" x2="600" y2="238" stroke="#8b949e" stroke-width="1"/>
  <line x1="80" y1="178" x2="586" y2="178" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="7 5"/>
  <path d="M80 236 C160 232, 232 220, 300 194 C380 164, 452 114, 512 66 C532 50, 546 42, 556 36" fill="none" stroke="#57606a" stroke-width="1.8"/>
  <path d="M80 236 C200 230, 340 222, 586 210" fill="none" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="2 5"/>
  <circle cx="308" cy="178" r="3.6" fill="none" stroke="#57606a" stroke-width="1.4"/>
